{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/albums/album-detail.css' %}" />
{% endblock %}

{% block content %}
<section class="album-container">
  <div class="album-details">
    <h1>{{ album.title }}</h1>
    <h2>{{ album.artist }} ({{ album.year }})</h2>
    <p><strong>Rating:</strong> {{ album.rating }}/10</p>
    <p>{{ album.notes }}</p>
  </div>
</section>
{% endblock %}
