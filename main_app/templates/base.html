{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Journal</title>

  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  
  <link rel="shortcut icon"
        type="image/png"
        href="{% static 'images/music-note.png' %}">

  {% block head %}{% endblock %}
</head>

<body>

<header>
  <div class="header-logo-container">
    <a href="{% url 'home' %}">
      <img src="{% static 'images/logo.png' %}" alt="Music Journal Logo">
    </a>
  </div>

  <nav>
  <ul>
    {% if user.is_authenticated %}
      <li><a href="{% url 'album-index' %}">All Albums</a></li>
      <li><a href="{% url 'tag-index' %}">All Tags</a></li>
      <li><a href="{% url 'album-create' %}">Add an Album</a></li>
      <li><a href="{% url 'tag-create' %}">Add a Tag</a></li>
      <li><a href="{% url 'about' %}">About</a></li>
      <li>
        <form id="logout-form" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Log Out</button>
        </form>
      </li>
    {% else %}
      <li><a href="{% url 'about' %}">About</a></li>
      <li><a href="{% url 'home' %}">Login</a></li>
      <li><a href="{% url 'signup' %}">Sign Up</a></li>
    {% endif %}
  </ul>
</nav>
</header>

<main>
  {% block content %}
  {% endblock %}
</main>

</body>
</html>
